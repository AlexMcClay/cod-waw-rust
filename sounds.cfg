# Undead Rounds - sound mapping
#
# With a World at War install, gameplay sounds come straight from the game:
# the same sound aliases its scripts play (round chalk, box, boards, power-ups,
# music), each weapon's own sounds, and animation notetracks (reload clicks,
# bolt pulls, zombie vocals and footsteps). This file only sets the
# stand-in sound for events the game data doesn't cover, or for playing
# without an install.
#
#   event = source | source | ...      (one is picked at random)
#
# A source can be:
#   alias:<name>      a sound alias from your World at War install's fastfiles
#   iwd/<path>.wav    a file inside the install's .iwd archives
#   <path>.wav        a file in the extracted folder (tools\extract_zombies.py)
# Missing sources fall back to built-in procedural sounds.

round_start   = alias:chalk
game_start    = alias:chalk
round_end     = alias:round_over
wall_buy      = alias:cha_ching
purchase      = alias:cha_ching
deny          = alias:no_cha_ching
game_over     = alias:mx_game_over
door_open     = alias:weap_wall
crate_open    = alias:lid_open

zombie_groan  = alias:amb_vocals
zombie_attack = alias:attack_vocals
board_tear    = alias:break_boards
board_repair  = alias:repair_boards
headshot      = alias:zombie_head_gib
knife         = alias:melee_swing_plr
player_hurt   = alias:player_pain_small
powerup_spawn = alias:spawn_powerup
powerup_grab  = alias:powerup_grabbed
max_ammo      = alias:full_ammo
