# Undead Rounds - texture mapping for the prototype bunker map
#
# surface = image name in your World at War install (images/<name>.iwi)
# Missing images fall back to flat colours. Nacht der Untoten uses the map's
# own materials and ignores this file.

wall      = berlin_wall_brick_gritty_c
floor     = berlin_floors_wood_dirty_dark1_c
ceiling   = berlin_ceiling_wood_dirty_c
trim      = berlin_trim_wood_plain2_c
ground    = berlin_terrain_dirt_regular_c
bark      = berlin_trim_wood_plain2_c
board     = makin_wall_wood_planks02_c
rubble    = berlin_terrain_rubble_large_c
crate     = zombie_treasure_box_c

# Chalk outlines for wall-buys, per weapon id.
chalk.kar98k   = k98_chalk_c
chalk.m1carbine = m1carbine_chalk_c
chalk.m1garand = m1garand_chalk_c
chalk.thompson = tommy_chalk_c
chalk.mp40     = mp40_chalk_c
chalk.ppsh     = ppsh_chalk_c
chalk.stg44    = stg44_chalk_c
chalk.bar      = bar_chalk_c
chalk.trenchgun = anygun_chalk_c
chalk.doublebarrel = db_shotgun_chalk_c
chalk.doublebarrel_sawed_grip = sawedoff_chalk_c
